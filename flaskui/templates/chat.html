<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UOBot - University Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-header {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .chat-header img {
      width: 48px;
      height: auto;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 32px;
      color: #111827;
    }

    .chat-box {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      padding: 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      height: 75vh;
    }

    .messages {
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 16px;
    }

    .message.user {
      background-color: #dbeafe;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      background-color: #ecfdf5;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .chat-form {
      display: flex;
      margin-top: 20px;
      gap: 10px;
    }

    .chat-form input[type="text"] {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      transition: border 0.2s;
    }

    .chat-form input:focus {
      border-color: #2563eb;
    }

    .chat-form button {
      padding: 14px 24px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .chat-form button:hover {
      background-color: #1e40af;
    }

    .login-btn-container {
      text-align: center;
      margin-top: 10px;
    }

    .login-btn {
      background: #10b981;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .login-btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="chat-header">
      <img src="{{ url_for('static', filename='images/UOB-Logo-Transparant.png') }}" alt="UOB Logo" />
      <h1>UOBot Assistant</h1>
    </div>
    <div class="chat-box">
      <div class="messages" id="messages">
        <!-- Welcome message rendered same as bot response -->
      </div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="message-input" placeholder="Type your question here..." required autofocus />
        <button type="submit">Send</button>
      </form>
    </div>
    <div class="login-btn-container">
      <a href="/login" class="login-btn">Login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const messages = document.getElementById("messages");

    // Initial welcome message
    addMessage("bot", "Hello! Ask me anything about your university. Type '/bye' to end the session.");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (!msg) return;
      addMessage("user", msg);
      input.value = "";
      try {
        const response = await fetch("/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        const data = await response.json();
        addMessage("bot", data.answer);
      } catch (error) {
        addMessage("bot", "⚠️ Sorry, something went wrong.");
      }
    });

    function addMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = `<strong>${sender === "user" ? "🧑‍🎓 You" : "🤖 UOBot"}</strong>: ${text}`;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
